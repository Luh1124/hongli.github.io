name: Update Scholar Stats

on:
  schedule:
    - cron: '30 2 * * *'  # daily at 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch citation stats
        continue-on-error: true  # Scholar occasionally blocks CI IPs; keep last known value
        run: python scripts/update_scholar_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          git diff --cached --quiet || (git commit -m "chore: update scholar stats" && git push)
